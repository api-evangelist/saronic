aid: saronic
name: Saronic Technologies
description: |
  Saronic Technologies designs, manufactures, and deploys AI-enabled autonomous
  surface vessels (ASVs) for maritime security, domain awareness, reconnaissance,
  logistics, and payload delivery. The Austin-based company sells to the U.S.
  Navy, allied defense forces, and select commercial and government customers.
  Vessel models include Spyglass, Cutlass, Corsair, and Marauder, ranging from 6
  to 150 feet. The Echelon software platform provides mission planning,
  high-fidelity simulation, fleet command-and-control, and open architecture for
  third-party payload integration (ISR sensors, EW, comms, weapons). Saronic does
  not publish a public, self-service developer API; integrations are arranged
  through partnership and are subject to U.S. export controls (ITAR/EAR).
